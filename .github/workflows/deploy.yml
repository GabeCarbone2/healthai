name: Deploy de produção

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Instalar suporte a senha SSH
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes sshpass
          fi

      - name: Sincronizar release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          rsync --archive --delete \
            --rsh 'sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude '.venv/' \
            --exclude 'data/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude '**/__pycache__/' \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Executar deploy com backup e readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && ./deploy/deploy.sh"
