[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthai"
version = "0.1.0"
description = "Predição acadêmica de risco de diabetes com machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
notebooks = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[project.scripts]
healthai-train = "healthai.train:main"
healthai-predict = "healthai.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

